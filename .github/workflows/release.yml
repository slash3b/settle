name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.Version=${{ github.ref_name }} -X 'main.BuildTime=$(date -u '+%Y-%m-%d %H:%M:%S UTC')'" -o settle-linux-amd64 .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: settle-linux-amd64
          generate_release_notes: true
