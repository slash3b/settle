version: "2"

linters:
  default: none
  enable:
    # --- default set ---
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # --- correctness ---
    - bodyclose
    - errorlint
    - exhaustive
    - forcetypeassert
    - makezero
    - nilerr
    - nilnesserr
    - noinlineerr
    - rowserrcheck
    - sqlclosecheck
    - wastedassign

    # --- style / quality ---
    - goconst
    - gocritic
    - intrange
    - mirror
    - modernize
    - nakedret
    - prealloc
    - predeclared
    - recvcheck
    - revive
    - unconvert
    - unparam
    - whitespace
    - wsl_v5

    # --- security ---
    - gosec

    # --- tests ---
    - testifylint
    - usetesting

  exclusions:
    rules:
      - path: '(.+)_test\.go'
        linters:
          - gosec
          - goconst

  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gosec:
      excludes:
        - G204  # subprocess launched with variable — unavoidable for a tool like settle
    revive:
      rules:
        - name: exported
          disabled: true  # don't require doc comments on every export
    gocritic:
      disabled-checks:
        - commentedOutCode
